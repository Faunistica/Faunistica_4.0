services:
  postgres:
    image: postgres:15-alpine
    container_name: fau_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    mem_limit: 512m

  backend:
    image: ghcr.io/faunistica/backend:latest
    container_name: fau_backend
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # - backend_data:/app/data     # закомментировано — данные из образа, см. README
    ports:
      - 127.0.0.1:5001:5001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/docs')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: always
    mem_limit: 1g

  # Фронтенд-контейнер сам выступает в роли reverse proxy.
  # nginx внутри контейнера проксирует /api/ → backend (конфиг вшит в образ).
  # Отдельный nginx-контейнер не нужен.
  frontend:
    image: ghcr.io/faunistica/frontend:latest
    container_name: fau_frontend
    ports:
      - 80:80
      - 443:443
    volumes: []
    # Для замены self-signed сертификата на реальный:
    # - /etc/letsencrypt:/etc/nginx/ssl:ro
    depends_on:
      - backend
    restart: always
    mem_limit: 128m

volumes:
  postgres_data:
# backend_data:
