# Combined config: serves static SPA + proxies /api/ to backend.
# Mount into frontend container at /etc/nginx/conf.d/default.conf:
#   volumes:
#     - ./nginx/faunistica.conf:/etc/nginx/conf.d/default.conf:ro
#
# This replaces the baked-in static-only config, letting the frontend
# container handle both jobs — no separate nginx container needed.

upstream backend {
    server backend:5001;
}

server {
    listen 80;
    server_name faunistica.ru;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Безопасность
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self';
        connect-src 'self';
        frame-ancestors 'none';
    " always;

    client_max_body_size 20M;

    # ------------------------------------------------------------------
    # Сжатие
    # ------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    # ------------------------------------------------------------------
    # Статика — сборка Vite
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA — всё, что не /api, не /assets, не /docs, отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # ------------------------------------------------------------------
    # API — бэкенд
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ------------------------------------------------------------------
    # Документация FastAPI
    # ------------------------------------------------------------------
    location /docs {
        proxy_pass http://backend/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://backend/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

