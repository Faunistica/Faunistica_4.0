services:
  backend:
    image: ghcr.io/faunistica/backend:latest
    container_name: fau_backend_hybrid
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # - backend_data:/app/data     # закомментировано — данные из образа, см. README
      # Монтируем сокет PostgreSQL с хоста.
      # Дебиан/Ubuntu: /var/run/postgresql
      # Arch Linux:    /run/postgresql
      - /var/run/postgresql:/var/run/postgresql:ro
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      # При подключении через Unix-сокет хост и порт игнорируются,
      # но должны быть указаны корректно для построения DSN.
      # При TCP-подключении к localhost:5432 замените DB_HOST на localhost.
      DB_HOST: /var/run/postgresql
      DB_PORT: 5432
    restart: always
    mem_limit: 1g

  frontend:
    image: ghcr.io/faunistica/frontend:latest
    container_name: fau_frontend_hybrid
    ports:
      - "127.0.0.1:8080:80"
    restart: always
    mem_limit: 128m

