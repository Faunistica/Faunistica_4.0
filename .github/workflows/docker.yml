name: Docker

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: faunistica/backend
  FRONTEND_IMAGE: faunistica/frontend

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:edge
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=edge
            GIT_BRANCH=${{ github.ref_name }}
      - name: Smoke test
        run: |
          docker run -d --name test-backend \
            -p 5501:5001 \
            -e JWT_SECRET=test \
            -e BOT_TOKEN=dummy \
            -e ADMIN_CHAT_ID=-1 \
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:edge
          sleep 3
          docker exec test-backend /scripts/healthcheck.py
          docker rm -f test-backend

  build-frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:edge
          build-args: |
            VITE_API_URL=/api
      - name: Smoke test
        run: |
          docker run -d --name test-frontend -p 8080:80 ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:edge
          sleep 2
          curl -f http://localhost:8080/ || (docker logs test-frontend && false)
          docker rm -f test-frontend
