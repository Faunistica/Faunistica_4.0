name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: faunistica/backend
  FRONTEND_IMAGE: faunistica/frontend

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: faunistica
          POSTGRES_PASSWORD: faunistica
          POSTGRES_DB: faunistica
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: ./.github/actions/docker-build
        with:
          registry: ${{ env.REGISTRY }}
          backend-image: ${{ env.BACKEND_IMAGE }}
          frontend-image: ${{ env.FRONTEND_IMAGE }}
          backend-tags: >-
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:edge
          frontend-tags: >-
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:edge
          git-commit: ${{ github.sha }}
          git-tag: ${{ github.ref_name }}
          git-branch: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
