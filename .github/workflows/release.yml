name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: faunistica/backend
  FRONTEND_IMAGE: faunistica/frontend

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:edge
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
            GIT_BRANCH=${{ github.ref_name }}

      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:edge

      - name: Smoke test backend
        run: |
          docker run -d --name test-backend \
            -p 5501:5001 \
            -e JWT_SECRET=test \
            -e BOT_TOKEN=dummy \
            -e ADMIN_CHAT_ID=-1 \
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
          sleep 3
          docker exec test-backend /scripts/healthcheck.py
          docker rm -f test-backend

      - name: Smoke test frontend
        run: |
          docker run -d --name test-frontend -p 8080:80 ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
          sleep 2
          curl -f http://localhost:8080/ || (docker logs test-frontend && false)
          docker rm -f test-frontend
