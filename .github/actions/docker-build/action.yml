name: Docker Build
description: Build, push, and smoke test backend + frontend images

inputs:
  registry:
    description: Container registry
    required: false
    default: ghcr.io
  backend-image:
    description: Backend image name
    required: true
  frontend-image:
    description: Frontend image name
    required: true
  backend-tags:
    description: Backend tags (full, multi-line or comma-separated)
    required: true
  frontend-tags:
    description: Frontend tags (full, multi-line or comma-separated)
    required: true
  git-commit:
    description: Git commit SHA
    required: true
  git-tag:
    description: Git tag (e.g. "edge" or "v1.0.0")
    required: true
  git-branch:
    description: Git branch name
    required: true
  github-token:
    description: GitHub token for Docker login
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6

    - uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build & push backend
      uses: docker/build-push-action@v6
      with:
        context: backend
        push: true
        load: true
        tags: ${{ inputs.backend-tags }}
        build-args: |
          GIT_COMMIT=${{ inputs.git-commit }}
          GIT_TAG=${{ inputs.git-tag }}
          GIT_BRANCH=${{ inputs.git-branch }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test backend
      shell: bash
      run: |
        TAG="${{ inputs.registry }}/${{ inputs.backend-image }}:edge"
        docker run -d --name test-backend --network host \
          -e JWT_SECRET=test \
          -e BOT_TOKEN=dummy \
          -e ADMIN_CHAT_ID=-1 \
          -e DB_PASSWORD=faunistica \
          "$TAG"
        for i in $(seq 1 12); do
          docker exec test-backend /scripts/healthcheck.py && break
          sleep 5
        done
        docker exec test-backend /scripts/healthcheck.py
        docker rm -f test-backend

    - name: Build & push frontend
      uses: docker/build-push-action@v6
      with:
        context: frontend
        push: true
        load: true
        tags: ${{ inputs.frontend-tags }}
        build-args: |
          VITE_API_URL=/api
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test frontend
      shell: bash
      run: |
        TAG="${{ inputs.registry }}/${{ inputs.frontend-image }}:edge"
        docker run -d --name test-frontend -p 8080:80 "$TAG"
        for i in $(seq 1 6); do
          curl -sf http://localhost:8080/ && break
          sleep 2
        done
        curl -f http://localhost:8080/ || (docker logs test-frontend && false)
        docker rm -f test-frontend
