name: Docker Build
description: Build, push, and smoke test backend + frontend images

inputs:
  registry:
    description: Container registry
    required: false
    default: ghcr.io
  backend-image:
    description: Backend image name
    required: true
  frontend-image:
    description: Frontend image name
    required: true
  backend-tags:
    description: Backend tags (full, multi-line or comma-separated)
    required: true
  frontend-tags:
    description: Frontend tags (full, multi-line or comma-separated)
    required: true
  git-commit:
    description: Git commit SHA
    required: true
  git-tag:
    description: Git tag (e.g. "edge" or "v1.0.0")
    required: true
  git-branch:
    description: Git branch name
    required: true
  github-token:
    description: GitHub token for Docker login
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        persist-credentials: false

    - uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Build backend
      uses: docker/build-push-action@v6
      with:
        context: backend
        push: false
        load: true
        tags: ${{ inputs.backend-tags }}
        build-args: |
          GIT_COMMIT=${{ inputs.git-commit }}
          GIT_TAG=${{ inputs.git-tag }}
          GIT_BRANCH=${{ inputs.git-branch }}
        cache-from: type=gha

    - name: Build frontend
      uses: docker/build-push-action@v6
      with:
        context: frontend
        push: false
        load: true
        tags: ${{ inputs.frontend-tags }}
        build-args: |
          VITE_API_URL=/api
        cache-from: type=gha

    - name: Smoke test both
      shell: bash
      run: |
        set -- ${{ inputs.backend-tags }}; BACKEND_TAG=$1
        set -- ${{ inputs.frontend-tags }}; FRONTEND_TAG=$1

        docker run -d --name test-backend --network host \
          -e JWT_SECRET=test \
          -e BOT_TOKEN=dummy \
          -e BOT_ENABLED=false \
          -e ADMIN_CHAT_ID=-1 \
          -e DB_PASSWORD=faunistica \
          "$BACKEND_TAG"

        for i in $(seq 1 12); do
          docker exec test-backend /scripts/healthcheck.py && break
          sleep 5
        done
        docker exec test-backend /scripts/healthcheck.py

        docker run -d --name test-frontend --network host \
          --add-host backend:127.0.0.1 \
          "$FRONTEND_TAG"

        for i in $(seq 1 6); do
          curl -sf http://localhost/ && break
          sleep 2
        done
        curl -f http://localhost/ || (docker logs test-frontend && false)

        for i in $(seq 1 6); do
          curl -skf https://localhost/ && break
          sleep 2
        done
        curl -skf https://localhost/ || (docker logs test-frontend && false)

        docker rm -f test-frontend test-backend

    - name: Push backend
      shell: bash
      run: |
        for tag in ${{ inputs.backend-tags }}; do
          [ -n "$tag" ] || continue
          docker push "$tag"
        done

    - name: Push frontend
      shell: bash
      run: |
        for tag in ${{ inputs.frontend-tags }}; do
          [ -n "$tag" ] || continue
          docker push "$tag"
        done
